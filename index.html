/* Layout: desktop only. Graph paper on a darker table. The menu is one Du Bois plate (caps title, bilingual caption, four small plates on an ink staircase, credit line); in game one large paper plate sits between a top line (CONTENTS · plate · RECORDS) and a bottom line (result). */
/* Palette after W. E. B. Du Bois's 1900 plates, edited for the game: dots in pink (×1), hot pink (×2), Du Bois crimson (×4), heavier dots on top; areas in tan–gold–brown; answers only in Du Bois blue; learning and growth (notes, good rounds, new bests, records) in a muted Du Bois green. */
:root{
  --bg:#cdbb95; --gridout:#b9b08a; --field:#eadcbd; --grid:#d0cca6; --ink:#2a231c; --muted:#574c3e;
  --d1:#dc8f97; --d2:#e652a3; --d4:#dc143c; --ans:#3a6ea5; --gold:#e1b767;
  --grow:#3d7a4f; --growl:#5f9169; --growbar:#b9c29d; --mosno:#e0c8a0;
  --r1:#f3e7ce; --r2:#e0c8a0; --r3:#d3a959; --r4:#c38637; --r5:#a76b3a; --r6:#885233; --r7:#693d28; --r8:#4a291c;
  color-scheme:light;
  --f-ui:"Public Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-d:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --gridout:#1c1a18; --field:#23201e; --grid:#34302c; --ink:#e9dfcc; --muted:#a89d8a;
    --d1:#8c4353; --d2:#d84497; --d4:#fe7d85; --ans:#7eaee0; --gold:#a8843f; --grow:#a9c97f; --growl:#7c9466; --growbar:#4f5a3c; --mosno:#3d362c;
    --r1:#e2d6bf; --r2:#d3bc96; --r3:#c9a257; --r4:#be843a; --r5:#a56c3f; --r6:#8b573a; --r7:#6f4531; --r8:#543427;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --gridout:#1c1a18; --field:#23201e; --grid:#34302c; --ink:#e9dfcc; --muted:#a89d8a;
  --d1:#8c4353; --d2:#d84497; --d4:#fe7d85; --ans:#7eaee0; --gold:#a8843f; --grow:#a9c97f; --growl:#7c9466; --growbar:#4f5a3c; --mosno:#3d362c;
  --r1:#e2d6bf; --r2:#d3bc96; --r3:#c9a257; --r4:#be843a; --r5:#a56c3f; --r6:#8b573a; --r7:#6f4531; --r8:#543427;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.menu,.hud,.summary,.modal,.phone{-webkit-user-select:none;user-select:none}

.link{background:none;border:0;padding:2px 0;cursor:pointer;font:500 clamp(12px,.72vw,16px) var(--f-d);letter-spacing:.18em;color:var(--ink);opacity:.82;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.link:hover{opacity:1}
.cap{margin:0;font:400 11px var(--f-d);letter-spacing:.18em;opacity:.75}

/* 메뉴: 듀보이스 도판 한 장 */
.menu{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 56px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-in{width:min(max(960px,58vw),100%);display:flex;flex-direction:column;align-items:center;text-align:center}
.title{margin:0;font:500 clamp(40px,4.6vw,110px)/1 var(--f-d);letter-spacing:.14em;padding-left:.14em}
.tagline{margin:16px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tagline .main{font-size:clamp(15px,1.2vw,26px)}
.sub{font:400 clamp(11px,.62vw,15px) var(--f-d);letter-spacing:.2em;color:var(--muted);opacity:.85}
.plates{margin-top:clamp(28px,5vh,50px);width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.4vw,30px);row-gap:14px}
/* 두 쌍 제목: 평균 | 관계 */
.pgrp{grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:9px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.pgrp .gname{font-size:clamp(13px,.95vw,20px)}
.plate{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:9px;transition:transform .18s ease}
.plate:not(.off):hover{transform:translateY(-3px)}
.plate.off{cursor:default}
.plate.off svg{opacity:.4}
.plate svg{width:100%;height:auto;display:block;overflow:visible}
.pbar{display:block;height:5px;background:var(--ink)}
.pname{font-size:clamp(14px,1vw,21px);line-height:1.2}
.plate .sub{margin-top:-3px}
.psoon{font-size:12px;color:var(--muted);min-height:15px}
.menu-rec{margin-top:clamp(24px,4.5vh,42px)}
/* 판권 자리: 언어와 크레딧 */
.colophon{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:8px}
.credit{margin:0;font:400 clamp(11px,.6vw,14px) var(--f-d);letter-spacing:.2em;opacity:.65}
.langs{margin:0;display:flex;align-items:center;gap:10px;font:400 clamp(11px,.6vw,14px) var(--f-d);letter-spacing:.2em}
.langs i{font-style:normal;opacity:.45}
.langs button{background:none;border:0;padding:2px 0;cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.langs button:hover{color:var(--ink)}
.langs button[aria-current="true"]{color:var(--ink);font-weight:500;text-decoration:none;cursor:default}
/* 앱 설치: 웹사이트에서 설치할 수 있을 때만 보임 (Claude 앱에서는 숨김) */
.inst{margin:0;display:flex;align-items:center;gap:10px;font:400 clamp(11px,.6vw,14px) var(--f-d);letter-spacing:.2em}
.inst i{font-style:normal;opacity:.45}
.inst a{color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:2px 0}
.inst a:hover{color:var(--ink)}
.inst button{background:none;border:0;padding:2px 0;cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.inst button:hover{color:var(--ink)}
.pf{fill:var(--field);stroke:var(--ink);stroke-width:1}
.pg{stroke:var(--grid);stroke-width:1}
.pl{stroke:var(--ink);stroke-width:1.4;fill:none}
.c-d1{fill:var(--d1)} .c-d2{fill:var(--d2)} .c-d4{fill:var(--d4)} .c-gold{fill:var(--gold)} .c-no{fill:var(--mosno)} .mb{stroke:var(--ink);stroke-width:.8}
.c-r1{fill:var(--r1)} .c-r2{fill:var(--r2)} .c-r3{fill:var(--r3)} .c-r4{fill:var(--r4)} .c-r6{fill:var(--r6)} .c-r7{fill:var(--r7)}
.plate path{stroke:var(--ink);stroke-width:1}
.plate path.po{stroke-width:2.2}
.c-ans{fill:none;stroke:var(--ans);stroke-width:1.4} .c-ansd{fill:var(--ans)} .pl.ansl{stroke:var(--ans)} .mo{stroke:var(--ink);stroke-width:.8}

/* 휴대폰 안내 */
.phone{position:fixed;inset:0;z-index:20;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.phone .title{font-size:44px}
.phone p{margin:0}
.phone .pmsg{font-size:16px}

/* 게임 글자 줄 */
.hud{position:fixed;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;pointer-events:none;
  padding-left:max(16px,2.5vw,env(safe-area-inset-left,0px));padding-right:max(16px,2.5vw,env(safe-area-inset-right,0px));transition:opacity .22s ease}
.hud button{pointer-events:auto}
.hud.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:4px}
.hud.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:4px}
body:not(.v-game) .hud{display:none}
body.hud-hide .hud{opacity:0}
.crumbs{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.crumbs .l{justify-self:start}
.crumbs .r{justify-self:end}
.crumbs .here{font:400 clamp(12px,.72vw,16px) var(--f-d);letter-spacing:.18em;opacity:.85;white-space:nowrap}
.prog{display:flex;gap:3px}
.prog i{display:block;width:clamp(15px,1vw,24px);height:4px;background:var(--ink);opacity:.16}
.prog i:nth-child(5),.prog i:nth-child(8){margin-left:8px}
.prog i.on{opacity:.85}
.prog i.on.good{background:var(--grow);opacity:1}   /* 좋음 이상으로 맞힌 판 */
.ask{margin:2px 0 0;font-size:clamp(15px,1vw,21px);line-height:1.4}
.spec{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;font-size:clamp(13px,.85vw,17px);color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}
.spec .it{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.spec b{color:var(--ink);font-weight:500}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.resrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 16px}
.result{margin:0;font-size:clamp(14px,.9vw,18px);color:var(--muted);font-variant-numeric:tabular-nums}
.result b{color:var(--ink);font-weight:500}
.act{font-size:clamp(14px,.9vw,18px);padding:6px 18px;min-height:32px;border:1px solid var(--ink);background:transparent;cursor:pointer}
.act:disabled{opacity:.3;cursor:default}
.coach{margin:0;padding:0;list-style:none;display:grid;gap:1px;align-content:start;font-size:clamp(13px,.85vw,17px);line-height:1.5;min-height:calc(3em + 1px)}

/* 판 결과 */
.dim{position:fixed;inset:0;z-index:6;background:var(--bg);opacity:.8}
.summary{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(max(370px,22vw),calc(100vw - 32px));
  max-height:calc(100% - 32px);overflow:auto;background:var(--field);border:1px solid var(--ink);padding:22px 24px 20px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.s-total{margin:8px 0 6px;font:500 58px/1 var(--f-d);font-variant-numeric:tabular-nums}
.s-total small{font-size:16px;opacity:.6;margin-left:6px}
/* 총점: 최근 5판 평균 위면 연한 초록, 최고 기록을 넘으면 진한 초록 + 신기록. 그 판의 첫 기록은 잉크 */
.s-total.gup{color:var(--growl)} .s-total.gbest{color:var(--grow)}
.s-total .nb{display:inline-block;margin-left:10px;vertical-align:top;font:500 12px/1 var(--f-ui);letter-spacing:.06em;color:var(--grow);padding-top:6px}
html[lang="en"] .s-total .nb{font-family:var(--f-d);letter-spacing:.16em}
.s-line{margin:0;font-size:clamp(13px,.8vw,16px);color:var(--muted);line-height:1.6}
.s-line b{color:var(--ink);font-weight:500}
.s-coach{margin:8px 0 0;font-size:13px;line-height:1.6}
.s-coach:empty{display:none}
.s-strip{width:100%;max-width:300px}
.s-strip:empty{display:none}
.s-strip svg{display:block;width:100%;height:auto;overflow:visible}
.s-btns{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:10px 20px;margin-top:14px}

/* RECORDS: 어두워진 게임 위로 리포트지 한 장이 올라옴 (게임 도중에도 꺼내 읽을 수 있음) */
.sheet{position:fixed;inset:0;z-index:8;display:flex;justify-content:center;align-items:flex-end}
.sheet-dim{position:absolute;inset:0;background:var(--bg);opacity:.8}
.paper{position:relative;width:min(max(760px,40vw),calc(100% - 32px));height:calc(100% - 36px);overflow:auto;background:var(--field);border:1px solid var(--ink);border-bottom:0;
  padding:0 clamp(18px,4vw,44px) calc(env(safe-area-inset-bottom,0px) + 48px)}
.sheet-bar{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;background:var(--field);padding-top:14px;padding-bottom:6px}
.focus{display:grid;gap:6px;text-align:center;padding:16px 0 14px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.f-name{margin:0;font-size:18px}
.f-memo{margin:4px auto 0;max-width:620px;font-size:clamp(15px,.85vw,18px);line-height:1.7}
.sec h3 sup{font-size:9px;margin-left:2px;letter-spacing:0}
.fn{margin:0;padding-left:20px;display:grid;gap:8px;font-size:clamp(12.5px,.72vw,15px);color:var(--muted);line-height:1.65}
.fn li::marker{font:500 11px var(--f-d);color:var(--ink)}
.rec{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:38px}
.rec-head{text-align:center;display:grid;gap:8px}
.rec-title{margin:0;font:500 clamp(30px,5vw,42px)/1 var(--f-d);letter-spacing:.14em;padding-left:.14em}
.rec-src{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.empty{margin:0;text-align:center;font-size:14px;line-height:1.7;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;text-align:center}
.stat .v{display:block;font:500 30px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.sec{display:grid;gap:14px;min-width:0}
.sec h3{margin:0;text-align:center;font:500 12px var(--f-d);letter-spacing:.24em;padding-left:.24em}
.p{margin:0;font-size:clamp(13px,.78vw,16px);color:var(--muted);line-height:1.7}
.p b{color:var(--ink);font-weight:500}
.p.c{text-align:center}
.locked{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.memo{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:m}
.memo li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:clamp(14px,.82vw,17px);line-height:1.65}
.memo li::before{counter-increment:m;content:counter(m);font:500 14px/22px var(--f-d)}
.best{display:grid;gap:10px}
.best .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;font-size:13px}
.best .track{position:relative;height:16px}
.best .fill{position:absolute;left:0;top:0;bottom:0;background:var(--growbar)}
.best .fill.none{width:100%;border:1px dashed var(--grid);background:none}
.best .val{position:absolute;top:50%;transform:translateY(-50%);font:500 12px var(--f-d);padding-left:6px;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.s-ink{stroke:var(--ink)} .s-grow{stroke:var(--grow)} .s-grid{stroke:var(--grid)}
.f-ink{fill:var(--ink)} .f-dot{fill:var(--d2)}
.t-cap{fill:var(--ink);opacity:.65;font:10px var(--f-d);letter-spacing:.06em}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink)}
.grp{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px;align-items:center}
.kv{margin:0;display:grid;gap:12px}
.kv div{display:grid;gap:2px}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font:500 17px var(--f-d);font-variant-numeric:tabular-nums}
.kv dd small{font:400 12px var(--f-ui);color:var(--muted);margin-left:8px}
.meters{display:grid;gap:18px}
.mrow{display:grid;gap:6px}
.mh{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.mv{font:500 13px var(--f-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.mv small{font:400 12px var(--f-ui);color:var(--muted);margin-left:6px}
.track2{position:relative;height:3px;background:var(--grid);margin:6px}
.track2 .zone{position:absolute;top:0;bottom:0;left:42.5%;width:15%;background:var(--ink);opacity:.22}
.track2 .mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:1px;background:var(--ink);opacity:.6}
.track2 .dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.types{width:100%;border-collapse:collapse;font-size:13px}
.types td{padding:6px 0;border-top:1px solid var(--grid);vertical-align:middle}
.types td.n,.types td.e{text-align:right;white-space:nowrap;padding-left:10px;font:400 12px var(--f-d);letter-spacing:.04em}
.types td.n{color:var(--muted)}
.types td.b{width:28%;padding-left:12px}
.types .bar{display:block;height:6px;background:var(--ink)}
.types .weak{font:500 10px var(--f-d);letter-spacing:.14em;margin-left:8px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px}
.tbtn{background:none;border:0;padding:3px 0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:4px}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.warn{color:var(--d4)}
.imp{display:grid;gap:8px}
.sheet textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--ink);padding:10px;background:var(--bg);color:var(--ink);
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.sheet textarea:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.msg{margin:0;text-align:center;font-size:13px;color:var(--ans);min-height:1em}
.confirm{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;font-size:13px}

/* 처음 하는 판 소개 */
.intro{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(max(440px,26vw),calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;
  background:var(--field);border:1px solid var(--ink);padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.i-fig{width:clamp(170px,11vw,260px)}
.i-fig svg,.xfig svg{width:100%;height:auto;display:block;overflow:visible}
.i-fig path,.xfig path{stroke:var(--ink);stroke-width:1}
.i-name{margin:2px 0 0;font-size:20px}
.i-text{margin:0;font-size:clamp(14px,.85vw,17px);line-height:1.75}
.i-hint{margin:0;font-size:12px;color:var(--muted)}
.intro .act{margin-top:6px}
/* 도판 설명 창 (윗줄 도판 이름을 누르면) */
.x-name{margin:0;font-size:clamp(26px,4vw,34px);font-weight:500}
.xfigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.xfig p{margin:6px 0 0;font-size:12.5px;text-align:center;line-height:1.5;color:var(--muted)}
.x-p{margin:0 auto;max-width:31em;font-size:clamp(15px,.85vw,18px);line-height:1.75;text-align:center}
/* 짧은 글은 줄 길이를 고르게 (한 줄만 유독 길거나 짧지 않게) */
.x-p,.i-text,.i-hint,.xfig p,.s-coach,.coach li,.lad-cap,.note p{text-wrap:balance}
.crumbs button.here{background:none;border:0;padding:2px 0;cursor:pointer;color:inherit}
.crumbs button.here:hover{text-decoration:underline;text-underline-offset:4px}
.notice{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.c-r5{fill:var(--r5)} .c-r8{fill:var(--r8)}
.linkbox{display:grid;gap:6px}
.linkbox input{width:100%;border:1px solid var(--ink);padding:8px 10px;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.ghost{position:fixed;z-index:5;background:var(--field);border:1px solid var(--ink);pointer-events:none}
/* 낱말 쪽지: 밑줄 친 낱말이나 계단을 누르면 그 자리에 올라오는 작은 종이 */
.term{cursor:help;pointer-events:auto;text-decoration:underline dotted var(--grow);text-decoration-thickness:1.5px;text-underline-offset:4px}
.term:hover,.term.on{text-decoration-style:solid;text-decoration-color:var(--grow)}
.term.on{background:color-mix(in srgb,var(--grow) 18%,transparent)}
.note{position:fixed;z-index:100;width:min(320px,calc(100vw - 24px));background:var(--field);border:1px solid var(--ink);border-top:4px solid var(--grow);box-shadow:5px 5px 0 rgba(0,0,0,.16);padding:14px 16px 12px;text-align:left;color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
.note::before{content:"";position:absolute;top:-9px;left:var(--ax,40px);width:12px;height:12px;background:var(--field);border-left:2px solid var(--grow);border-top:2px solid var(--grow);transform:rotate(45deg)}
.note.up::before{top:auto;bottom:-7px;border-width:1px;border-color:var(--ink);transform:rotate(225deg)}
.note .nh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--grow);padding-bottom:6px;margin-bottom:8px}
.note .nh b{font-weight:500;font-size:17px;color:var(--grow)}
.note .nh span{font:400 10px var(--f-d);letter-spacing:.22em;color:var(--muted);white-space:nowrap}
.note p{margin:0;font-size:13.5px;line-height:1.6}
.note p.ex{margin-top:6px;font-size:12.5px;color:var(--muted);text-align:center}
.note svg{display:block;width:100%;height:auto;margin:8px 0 0;overflow:visible}
.note .nt{font:400 9px var(--f-ui);fill:var(--muted);text-anchor:middle}
.note .nq{font:400 17px var(--f-ui);fill:var(--muted);text-anchor:middle}
.note .nx{margin-top:10px;padding-top:7px;border-top:1px dashed var(--grid);font:400 11px var(--f-d);letter-spacing:.16em;color:var(--muted)}
html[lang="ko"] .note .nx{font-family:var(--f-ui);letter-spacing:.02em;font-size:12px}
.note .nx button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;color:var(--grow);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* 설명 창 맨 위 계단: 먼저 알아 둘 것 → 이 판 */
.ladder{display:flex;align-items:flex-start;justify-content:center;gap:6px;margin-top:4px}
.rung{flex:0 1 128px;min-width:0;display:flex;flex-direction:column;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.rung .rb{display:block;border:1px solid var(--ink);background:var(--field);padding:9px 6px 8px;text-align:center}
.rung .rb b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.rung .rb span{display:block;margin-top:3px;font:400 9px var(--f-d);letter-spacing:.16em;color:var(--muted)}
.rung i{display:block;height:5px;margin-top:6px;background:var(--ink)}
.rung.here .rb{background:var(--ink);color:var(--field)} .rung.here .rb span{color:var(--bg)}
.rung:hover .rb,.rung.on .rb{outline:2px solid var(--grow);outline-offset:2px}
.ladder .ar{align-self:center;margin-top:-11px;font-size:14px;color:var(--muted)}
.lad-cap{margin:10px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
  const ROUNDS = 10;
  // 메뉴 순서 = 배우는 순서. 평균 둘(무게중심 · 기댓값) | 관계 둘(상관계수 · 연관)
  const MODES = ['centroid', 'expect', 'corr', 'assoc'];
  const READY = { centroid: true, expect: true, corr: true, assoc: true };    // 2-b: 네 판 모두
  const PLATE = { centroid: '01', expect: '02', corr: '03', assoc: '04' };
  const NAMES = {
    centroid: { ko: '무게중심', en: 'Centroid', fr: 'Barycentre' },
    expect: { ko: '기댓값', en: 'Expectation', fr: 'Espérance' },
    corr: { ko: '상관계수', en: 'Correlation', fr: 'Corrélation' },
    assoc: { ko: '연관', en: 'Association', fr: 'Association' }
  };
  const GROUPS = { avg: { ko: '평균', en: 'Averages', fr: 'Moyennes' }, rel: { ko: '관계', en: 'Relations', fr: 'Relations' } };
  const STEP = { centroid: 0.28, expect: 0.5, corr: 0.72, assoc: 1 };          // 잉크 계단: 개념이 어려울수록 진하게
  // 점수: 오차가 기준 오차(E80)면 80점, 그 4배면 60점, 4분의 1이면 91점.
  // E80은 4-b에서 '처음 하는 사람' 모형으로 맞춤: 그 사람이 어느 판에서든 평균 60점쯤 받도록 (무게중심은 판 높이 대비)
  const E80 = { centroid: 0.007, expect: 0.1, corr: 0.03, assoc: 0.022 };
  // 첫 자리에서 기준 오차의 절반 넘게 옮기면 '고친' 라운드. 오차가 그만큼 줄거나 늘면 '좋아짐/나빠짐'
  const ADJ = 0.5;
  const KEY_HIST = 'dotsense2-history', KEY_MODE = 'dotsense2-mode', KEY_LANG = 'dotsense2-lang', KEY_SEEN = 'dotsense2-seen';
  const tierOf = round => round <= 4 ? 1 : round <= 7 ? 2 : 3;                    // 난이도 4 · 3 · 3
  const $ = id => document.getElementById(id);

      'x.corr': { what: '두 값이 함께 움직이는 정도를 −1부터 1까지로 나타내요. 오른쪽 위로 뻗으면 +, 오른쪽 아래로 뻗으면 −예요.', trick: '애매한 구름은 실제보다 약하게 보기 쉬워요. 그리고 멀리 떨어진 점 하나가 r을 크게 바꿀 수 있어요.', use: '키와 몸무게, 공부 시간과 점수처럼 두 가지가 얼마나 같이 가는지 볼 때 써요. 함께 움직인다고 해서 한쪽이 원인이라는 뜻은 아니에요.', cap: ['동그란 구름: r = 0', '길쭉할수록 r이 커져요', '거의 한 줄: r ≈ 1'] },

  const openExplain = () => { if (view === 'game' && !introOpen) openSheet(els.exp, renderExplain); };
  const closeRecords = closeSheet;
  function setLang(l) {

  function applyStatic() {
    els.tagMain.textContent = t('tagMain'); els.tagSub.textContent = t('tagSub');

      const m = b.dataset.mode;

  // ───────── RECORDS (임시: 3-a에서 리포트지로 다시 만듦) ─────────
  const stat = (v, k) => `<div class="stat"><span class="v">${v}</span><span class="k">${k}</span></div>`;
  const sec = (title, body, n) => `<section class="sec"><h3>${title}${n ? `<sup>${n}</sup>` : ''}</h3>${body}</section>`;
  const locked = () => `<p class="locked">${t('r.locked')}</p>`;
  function bestRow(m, v) {
    const w = v != null ? Math.max(2, v / 10) : 0;
    return `<div class="row"><span>${modeName(m)}</span><div class="track">${v != null
      ? `<i class="fill" style="width:${w}%"></i><span class="val" style="left:min(${w}%, calc(100% - 44px))">${v}</span>`
      : `<i class="fill none"></i><span class="val" style="left:0;opacity:.6">${t('r.none')}</span>`}</div></div>`;
  }
  function trendSVG(games) {
    const tr = games.slice(-40), n = tr.length; if (n < 2) return '';
    const W = 600, Hh = 150, pl = 28, pr = 8, pt = 8, pb = 20;
    const X = i => pl + (W - pl - pr) * i / (n - 1), Y = v => pt + (Hh - pt - pb) * (1 - v / 100);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="TREND">`;
    for (const v of [0, 50, 100]) s += `<line class="s-grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="t-cap" x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`;
    const vals = tr.map(g => g.total / ROUNDS), ma = vals.map((_, i) => avg(vals.slice(Math.max(0, i - 4), i + 1)));
    s += `<polyline class="s-grow" fill="none" stroke-width="1.5" stroke-linejoin="round" points="${ma.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}"/>`;
    tr.forEach((g, i) => { s += `<circle class="f-ink" cx="${X(i).toFixed(1)}" cy="${Y(vals[i]).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3.2}" opacity="${STEP[g.mode] || 1}"/>`; });
    return s + '</svg>';
  }
  function groupSVG(rs, bias) {
    const c = 120, Rr = 104, lim = 0.08, sc = v => clamp(v, -lim, lim) / lim * Rr;
    let s = `<svg class="chart" viewBox="0 0 240 240" role="img" aria-label="GROUPING">`;
    s += `<line class="s-grid" x1="${c}" y1="${c - Rr}" x2="${c}" y2="${c + Rr}"/><line class="s-grid" x1="${c - Rr}" y1="${c}" x2="${c + Rr}" y2="${c}"/>`;
    for (const [v, lab] of [[0.02, '2%'], [0.05, '5%'], [0.08, '8%']]) { const rr = v / lim * Rr; s += `<circle class="s-grid" fill="none" cx="${c}" cy="${c}" r="${rr}"/><text class="t-cap" x="${c + rr * 0.72 + 3}" y="${c - rr * 0.72 - 3}">${lab}</text>`; }
    const r60 = rs.slice(-60);
    r60.forEach((r, i) => { s += `<circle class="f-dot" cx="${(c + sc(r.dx)).toFixed(1)}" cy="${(c + sc(r.dy)).toFixed(1)}" r="3.4" opacity="${(0.35 + 0.6 * (i + 1) / r60.length).toFixed(2)}"/>`; });
    const bx = c + sc(bias.x), by = c + sc(bias.y);
    s += `<line class="s-ink" stroke-width="1.5" stroke-linecap="round" x1="${c}" y1="${c}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><circle class="f-ink" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4"/>`;
    return s + '</svg>';
  }
  function meterRow(label, m, lo, hi, ends) {
    const ok = m && m.v != null && m.n > 0, pos = ok ? clamp((m.v - lo) / (hi - lo), 0, 1) * 100 : 50;
    return `<div class="mrow"><div class="mh"><span>${label}</span><span class="mv">${ok ? ipct(m.v) : '–'}<small>${t('r.m.n', m ? m.n : 0)}</small></span></div>`
      + `<div class="track2"><span class="zone"></span><span class="mid"></span>${ok ? `<span class="dot" style="left:${pos.toFixed(1)}%"></span>` : ''}</div>`
      + `<div class="ends"><span>${ends[0]}</span><span>${ends[1]}</span><span>${ends[2]}</span></div></div>`;
  }
  // 지금(또는 마지막으로 한) 도판의 약점을 맨 위에
  function focusSec(A, m) {
    if (!m) return '';
    const gs = A.games.filter(g => g.mode === m), r5 = gs.slice(-5);
    let body;
    if (!gs.length) body = `<p class="p c">${t('r.f.none')}</p>`;
    else if (!A.open(m)) body = `<p class="f-memo">${t('r.f.lock', gs.length)}</p>`;
    else { const it = coachItems(A).find(x => x.k === m); body = `<p class="f-memo">${it ? it.t : t('r.noMemo')}</p>`; }
    const line = gs.length ? `<p class="p c">${t('r.f.line', A.bestBy[m], Math.round(avg(r5.map(g => g.total))), r5.length)}</p>` : '';
    return `<section class="focus"><p class="cap">PLATE ${PLATE[m]} · ${NAMES[m].en.toUpperCase()}</p><p class="f-name">${modeName(m)}</p>${body}${line}</section>`;
  }
  function renderRecords() {
    const A = analyze(H);
    let h = `<header class="rec-head"><h2 class="rec-title">RECORDS.</h2><p class="rec-src">${t('r.src')}</p></header>`;
    if (!A.nGames) { h += `<p class="empty">${t('r.empty')}</p>` + dataSec(A); els.recIn.innerHTML = h; bindData(A); return; }
    h += focusSec(A, view === 'game' ? S.mode : (A.last ? A.last.mode : null));
    h += `<div class="stats">` + stat(A.nGames, t('r.k.games')) + stat(A.recent10 != null ? Math.round(A.recent10) : '–', t('r.k.recent10'))
      + stat(A.best, t('r.k.best')) + stat(Math.round(avg(A.recent.map(r => r.sc))), t('r.k.avg', A.recent.length)) + `</div>`;
    const memo = coachMemo(A);
    h += sec('COACH', !A.anyOpen ? locked() : memo.length ? `<ol class="memo">${memo.map(x => `<li><span>${x}</span></li>`).join('')}</ol>` : `<p class="p c">${t('r.noMemo')}</p>`, 1);
    h += sec('BEST BY PLATE', `<div class="best">${MODES.map(m => bestRow(m, A.bestBy[m])).join('')}</div>`, 2);
    const ts = trendSVG(A.games);
    h += sec('TREND', ts ? ts + `<div class="legend">${MODES.filter(m => A.gamesBy[m]).map(m => `<span><i style="opacity:${STEP[m]}"></i>${modeName(m)}</span>`).join('')}<span><i style="border-radius:1px;height:2px;width:14px"></i>${t('r.ma')}</span></div>` : `<p class="p c">${t('r.trendFew')}</p>`);
    if (A.gamesBy.centroid) {
      if (!A.open('centroid') || !A.bias) h += sec('GROUPING', locked(), 3);
      else {
        const share = A.bias.m / (Math.sqrt(A.bias.m ** 2 + A.scatter ** 2) || 1), s2 = share * share;
        h += sec('GROUPING', `<div class="grp">${groupSVG(A.spatial, A.bias)}<dl class="kv">`
          + `<div><dt>${t('r.g.bias')}</dt><dd>${pct(A.bias.m)}<small>${A.bias.m > 0.004 ? dirPhrase(A.bias.x, A.bias.y) : t('r.g.none')}</small></dd></div>`
          + `<div><dt>${t('r.g.scatter')}</dt><dd>${pct(A.scatter)}</dd></div>`
          + `<div><dt>${t('r.g.share')}</dt><dd>${Math.round(s2 * 100)}%<small>${t(s2 > 0.2 ? 'r.g.big' : 'r.g.small')}</small></dd></div>`
          + `</dl></div>`, 3);
      }
    }
    // 감각 지표: 도판 순서대로
    const mr = [];

      if (A.wi.n) mr.push(meterRow(t('r.m.wi'), A.wi, 0, 2, t('r.e.wi')));
      if (A.ti.n) mr.push(meterRow(t('r.m.ti'), A.ti, 0, 2, t('r.e.ti')));
    }
    if (A.open('expect') && A.ai.n) mr.push(meterRow(t('r.m.ai'), A.ai, 0, 2, t('r.e.ai')));
    if (A.open('corr')) {
      if (A.cb.n) mr.push(meterRow(t('r.m.cb'), A.cb, 0, 2, t('r.e.cb')));
      if (A.oi.n) mr.push(meterRow(t('r.m.oi'), A.oi, 0, 2, t('r.e.oi')));
    }
    if (A.open('assoc') && A.bi.n) mr.push(meterRow(t('r.m.bi'), A.bi, 0, 2, t('r.e.bi')));
    const signLine = A.open('corr') && A.sign ? `<p class="p">${t('r.m.sign', ipct(A.sign.rate), A.sign.n).trim()}</p>` : '';
    h += sec('SENSE', mr.length ? `<div class="meters">${mr.join('')}</div>${signLine}` : locked(), 4);
    const openTypes = A.types.filter(x => A.open(x.kind));
    const maxD = {}; for (const x of openTypes) maxD[x.kind] = Math.max(maxD[x.kind] || 0, x.d);
    h += sec('BY TYPE', !openTypes.length ? locked() : `<div class="tbl-wrap"><table class="types"><tbody>` + openTypes.map(x => {
      const weak = A.weak && A.weak.key === x.key;
      return `<tr><td>${t(x.key)}${weak ? `<span class="weak">${t('r.weak')}</span>` : ''}</td><td class="n">${x.n}</td><td class="e">${fmtE(x.kind, x.d)}</td><td class="b"><span class="bar" style="width:${(x.d / (maxD[x.kind] || 1) * 100).toFixed(0)}%;opacity:${weak ? 1 : 0.45}"></span></td></tr>`;
    }).join('') + `</tbody></table></div>`, 5);
    const fl = (A.first || []).filter(x => A.open(x[1]));
    const firstLine = fl.length ? `<p class="p">${t('r.proc.first', fl.map(([k, , v]) => `${t('r.m.' + k)} ${ipct(v.f)} → ${ipct(v.l)}`).join(' · '))}</p>` : '';
    h += sec('PROCESS', !A.anyOpen ? locked() : (A.adj ? `<p class="p">${t('r.proc.adj', Math.round(A.adj.share * 100), A.adj.better, A.adj.worse, Math.round(Math.abs(A.adj.rel) * 100), A.adj.rel >= 0)}</p>` : `<p class="p">${t('r.proc.noAdj')}</p>`) + firstLine, 6);
    // 주석: 각 지표를 어떻게 재는지 (공식 없이)
    h += `<section class="sec"><h3>NOTES</h3><ol class="fn">${[1, 2, 3, 4, 5, 6].map(i => `<li>${t('r.n' + i)}</li>`).join('')}</ol></section>`;
    h += dataSec(A);

  }
  // ───────── 기록 링크: 끝낸 판을 압축해서 주소 뒤(#records=)에 담음 ─────────
  const b64u = bytes => { let s0 = ''; for (let i = 0; i < bytes.length; i += 0x8000) s0 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s0).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

  const packGames = gs => gs.map(g => ({ i: g.id, t: g.t, m: g.mode, r: g.rounds.map(r => { const o = { k: r.k }; for (const key of NUM_KEYS) if (r[key] != null) o[key] = r[key]; if (r.sh) o.sh = r.sh; return o; }) }));
  const unpackGames = arr => Array.isArray(arr) ? arr.map(g => g && cleanGame({ id: g.i, t: g.t, mode: g.m, done: true, rounds: g.r })).filter(Boolean) : [];
  async function encodeRecords() {
    const bytes = new TextEncoder().encode(JSON.stringify(packGames(H.filter(g => g.done))));
    if (window.CompressionStream) {
      try { const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); } catch (e) {}

  async function decodeRecords(code) {
    const bytes = unb64u(code.slice(1));

    else txt = new TextDecoder().decode(bytes);
    return unpackGames(JSON.parse(txt));
  }
  function mergeGames(list) {
    let added = 0;

    if (added) { H.sort((a, b) => a.t - b.t); saveLocal(); }

  }
  const linkCode = text => { const m = /#records=([A-Za-z0-9_-]+)/.exec(text || ''); return m ? m[1] : null; };
  // 메뉴 아래 한 줄 알림 (기록 링크 · 앱 설치)
  function note(msg, ms) {
    els.notice.textContent = msg; els.notice.hidden = false;
    clearTimeout(note.tm); note.tm = setTimeout(() => { els.notice.hidden = true; }, ms || 6000);
  }
  // 기록 링크 받기: 처음 열 때의 주소, 열린 창에 붙여 넣은 주소(hashchange), 설치한 앱으로 연 주소(launchQueue)
  let lastCode = '';
  async function importFromHash(src) {
    const code = linkCode(src || location.hash); if (!code || code === lastCode) return;
    lastCode = code;
    if (linkCode(location.hash)) try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    let added = 0, ok = true;
    try { added = mergeGames(await decodeRecords(code)); } catch (e) { ok = false; }
    note(ok ? t('d.linked', added) : t('d.linkBad'));
    if (recOpen && sheetRender) sheetRender();
  }
  function dataSec(A) {
    return sec('DATA', `<div class="actions">`
      + `<button class="tbtn" id="linkBtn" tabindex="-1" ${A.nGames ? '' : 'disabled'}>${t('d.link')}</button>`
      + `<button class="tbtn" id="cpSum" tabindex="-1" ${A.nRounds ? '' : 'disabled'}>${t('d.copySum')}</button>`
      + `<button class="tbtn" id="cpAll" tabindex="-1" ${A.nRounds ? '' : 'disabled'}>${t('d.copyAll')}</button>`
      + `<button class="tbtn" id="impBtn" tabindex="-1">${t('d.import')}</button>`
      + `<button class="tbtn warn" id="wipeBtn" tabindex="-1" ${H.length ? '' : 'disabled'}>${t('d.wipe')}</button></div>`
      + `<div class="linkbox" id="linkBox" hidden><input id="linkOut" readonly aria-label="link"><p class="p c">${t('d.linkNote')}</p></div>`
      + `<div class="imp" id="impBox" hidden><textarea id="impText" placeholder="${t('d.ph')}"></textarea><div class="actions"><button class="tbtn" id="impGo" tabindex="-1">${t('d.merge')}</button><button class="tbtn" id="impCancel" tabindex="-1">${t('d.close')}</button></div></div>`
      + `<div class="confirm" id="wipeBox" hidden><span>${t('d.wipeQ', H.length)}</span><button class="tbtn warn" id="wipeGo" tabindex="-1">${t('d.wipeGo')}</button><button class="tbtn" id="wipeCancel" tabindex="-1">${t('d.wipeCancel')}</button></div>`
      + `<textarea id="cpFallback" hidden readonly></textarea>`
      + `<p class="msg" id="dataMsg" aria-live="polite"></p><p class="p c">${t('d.cap')}</p>`);
  }
  function bindData(A) {
    const msg = x => { const m = $('dataMsg'); if (m) m.textContent = x; };
    const copy = async (text, ok) => {
      const fb = $('cpFallback');

  // ───────── 버튼 (마우스로만) ─────────
  document.querySelectorAll('.plate').forEach(b => b.addEventListener('click', () => startGame(b.dataset.mode, b)));
  els.recFromMenu.addEventListener('click', openRecords);
  els.recFromGame.addEventListener('click', openRecords);
  els.sToRec.addEventListener('click', openRecords);
  document.querySelectorAll('[data-close], .sheet-dim').forEach(el => el.addEventListener('click', () => closeSheet()));
  els.toMenu.addEventListener('click', backToMenu);
  els.plateLab.addEventListener('click', openExplain);
  els.iGo.addEventListener('click', closeIntro);
  els.sToMenu.addEventListener('click', backToMenu);
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { if (!busy && b.dataset.lang !== lang) setLang(b.dataset.lang); }));
  els.act.addEventListener('click', () => { if (busy || recOpen) return; if (S.phase === 'guess') submit(); else if (S.phase === 'reveal') next(); });
  els.again.addEventListener('click', () => { if (busy || recOpen) return; newGame(); startDab(); });

  window.addEventListener('resize', fit);
  const ro = new ResizeObserver(() => { if (view === 'game' && S.phase !== 'reveal') fit(); });
  ro.observe(els.hudTop); ro.observe(els.hudBot);
  const onTheme = () => { if (view === 'game' && S.puz) sync(); draw(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (view === 'game') fit(); else draw(); });
  window.addEventListener('hashchange', () => importFromHash());
  if ('launchQueue' in window) try { window.launchQueue.setConsumer(p => { if (p && p.targetURL) importFromHash(p.targetURL); }); } catch (e) {}

  // ───────── 앱 설치 (웹사이트에서만: manifest가 있을 때) ─────────
  // Chrome · Edge는 설치 창을 띄우고, Mac Safari는 메뉴 위치를 알려 줌. 이미 앱으로 열었거나 Claude 앱 안이면 숨김
  const hasManifest = !!document.querySelector('link[rel="manifest"]');
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const UA = navigator.userAgent;
  const safariMac = /Macintosh/.test(UA) && /Version\/[\d.]+.*Safari\//.test(UA) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(UA) && navigator.maxTouchPoints < 2;
  let bip = null;
  // BROWSER APP: 웹사이트에서 설치할 수 있을 때. WINDOWS: Windows 컴퓨터에서 (설치한 앱 안 · 휴대폰 · Mac은 숨김)
  const winOK = /Windows NT/.test(UA) && !/Electron/.test(UA) && !standalone();
  const winDl = $('winDl'), instSep = $('instSep'); winDl.href = WIN_EXE;
  const instShow = () => {
    const app = hasManifest && !standalone() && !!(bip || safariMac);
    els.inst.hidden = !app; winDl.hidden = !winOK; instSep.hidden = !(app && winOK);
    els.instRow.hidden = !(app || winOK);
  };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); bip = e; instShow(); });
  window.addEventListener('appinstalled', () => { bip = null; instShow(); note(t('inst.done')); });
  els.inst.addEventListener('click', async () => {
    if (bip) {
      const p = bip; bip = null;
      try { await p.prompt(); const c = await p.userChoice; if (c && c.outcome === 'accepted') { instShow(); return; } } catch (e) {}
      instShow();
    } else if (safariMac) note(t('inst.safari'), 9000);
  });
  instShow();

  function start(data) {
    const saved = load(KEY_LANG);
    // 저장한 언어가 없으면 브라우저 언어로: 한국어 브라우저는 한국어, 그 밖은 영어
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ko';
    lang = saved === 'en' || saved === 'ko' ? saved : (/^ko/i.test(nav) ? 'ko' : 'en');
    document.documentElement.lang = lang;
    applyStatic();
    if (isPhone) { els.phone.hidden = false; els.menu.hidden = true; }
    VW = window.innerWidth; VH = window.innerHeight;
    if (data && data.view === 'game' && data.S && data.S.puz && READY[data.S.mode]) {
      Object.assign(S, data.S);
      els.menu.hidden = true; setViewClass('game'); view = 'game';
      sync(); fit();
      if (S.phase === 'done') renderSummary(analyze(H));
    } else { dropUnfinished(); setViewClass('menu'); view = 'menu'; if (!isPhone) els.menu.hidden = false; fit(); }
    importFromHash();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), view })); } catch (e) {}
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script>
// 오프라인 실행과 앱 설치를 위한 서비스 워커 (https 또는 localhost에서만)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
